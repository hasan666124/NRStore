<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#4A3AFF"
    >

    <meta
        name="description"
        content="NR Store - Discover, download and enjoy apps."
    >

    <title>NR Store</title>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="splash">

        <!-- Background Decorations -->

        <div class="circle one"></div>

        <div class="circle two"></div>


        <!-- NR Store Logo -->

        <div class="logo">

            <span>NR</span>

        </div>


        <!-- App Name -->

        <h1>
            NR Store
        </h1>


        <!-- Tagline -->

        <p class="tagline">
            Apps Make Life Easier
        </p>


        <!-- Features -->

        <section class="features">


            <!-- Feature 1 -->

            <div class="feature">

                <div class="feature-icon">
                    🛡️
                </div>

                <div class="feature-title">
                    Safe Downloads
                </div>

            </div>


            <!-- Feature 2 -->

            <div class="feature">

                <div class="feature-icon">
                    ⚡
                </div>

                <div class="feature-title">
                    Fast Access
                </div>

            </div>


            <!-- Feature 3 -->

            <div class="feature">

                <div class="feature-icon">
                    📱
                </div>

                <div class="feature-title">
                    Wide Collection
                </div>

            </div>


            <!-- Feature 4 -->

            <div class="feature">

                <div class="feature-icon">
                    ✨
                </div>

                <div class="feature-title">
                    Better Experience
                </div>

            </div>

        </section>


        <!-- Loading -->

        <div class="loading">

            <div class="spinner"></div>

            <span class="loading-text">
                Loading...
            </span>

        </div>

    </main>


    <!-- Splash Navigation -->

    <script>

        /*
         * NR Store Splash Screen
         *
         * After 2.5 seconds,
         * open the main app.
         */

        setTimeout(function () {

            window.location.href = "app.html";

        }, 2500);

    </script>

</body>

    </html>
